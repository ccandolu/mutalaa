<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071426">
<title>MÜTALAA — Dijital İlim Kütüphanesi</title>
<style>
:root{--bg:#071426;--panel:rgba(255,255,255,.055);--line:rgba(255,255,255,.11);--muted:#94a9c5;--blue:#8cb9f3}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#19396b 0%,transparent 42%),radial-gradient(ellipse at 95% 70%,#102d55 0%,transparent 35%),var(--bg);color:#edf4ff;font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer;color:inherit;transition:.2s}button:hover{filter:brightness(1.2);transform:translateY(-1px)}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.sidebar{padding:25px 18px;border-right:1px solid var(--line);background:#07142680;display:flex;flex-direction:column;gap:30px}
.brand{display:flex;align-items:center;gap:12px}.brandmark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#315f9a,#132b4b);font-size:22px}.brandname{font-size:14px;letter-spacing:3px;font-weight:700}.subbrand{font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:4px}
.navtitle{font-size:10px;color:var(--muted);letter-spacing:2px;margin:0 0 10px 9px}.navbtn{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;padding:12px;border-radius:11px;color:#9aadc8;font-size:13px;margin:3px 0}.navbtn.active{background:rgba(91,148,224,.17);color:white;border-color:rgba(125,177,244,.2)}
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:17px}.goal{padding:14px;margin-top:auto}.muted{color:var(--muted)}.small{font-size:11px}.progress{height:5px;background:#ffffff20;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:var(--blue);border-radius:9px;transition:width .2s}
main{padding:30px 34px 150px;min-width:0;max-width:1500px;width:100%;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.crumb{font-size:10px;color:var(--muted);letter-spacing:2px}.topactions{display:flex;gap:8px}.secondary,.primary{border-radius:11px;padding:10px 14px;border:1px solid var(--line);background:#ffffff0b;font-size:12px}.primary{background:linear-gradient(135deg,#4e83c9,#2860a5);border-color:#8ab9f055;color:white;padding:11px 17px}
input[type=search],.searchinput{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#ffffff0a;color:white;outline:none}.searchinput:focus{border-color:#75a9e8}
.hero{padding:30px;position:relative;overflow:hidden;margin-bottom:30px}.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#6ca8ed;filter:blur(75px);opacity:.16;right:-55px;top:-100px}.hero>*{position:relative;z-index:1}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--muted)}h1{font-size:clamp(30px,5vw,46px);line-height:1.15;margin:18px 0 12px}h1 span{color:#9fc8fa}.hero p{font-size:14px;line-height:1.7;color:var(--muted);max-width:500px}
.sectionhead{margin:28px 0 16px}.sectionhead h2{font-size:19px;margin:0}.sectionhead p{font-size:12px;color:var(--muted);margin:6px 0 0}
.bookgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:25px 18px}.book{min-width:0;animation:fadeup .35s ease both}.bookcover{aspect-ratio:3/4;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;box-shadow:0 12px 30px #0005;text-align:center;padding:12px}.bookcover:after{content:"";position:absolute;inset:8px;border:1px solid #ffffff35;border-radius:5px}.bookcover>div{position:relative;z-index:1}.bookcover .symbol{font-size:38px;margin-bottom:13px}.bookcover .brandmini{font-size:9px;letter-spacing:3px}.bookcover .covername{font-size:12px;font-weight:650;margin-top:12px}.bookcover .coverauthor{font-size:9px;opacity:.75;margin-top:8px}.booktitle{font-size:13px;font-weight:600;margin-top:12px;line-height:1.4}.bookauthor,.bookmeta{font-size:11px;color:var(--muted);margin-top:5px}.bookactions{display:flex;gap:7px;margin-top:10px}.bookactions button{flex:1}.bookactions .secondary{padding:8px}
.page{animation:fadeup .35s ease both}@keyframes fadeup{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:14px}.filters button{white-space:nowrap}.selected{border-color:#8cb9f3!important;background:#4779b522!important}
.player{position:fixed;bottom:12px;left:240px;right:18px;z-index:10;background:linear-gradient(110deg,#122a49f2,#0b1b31f5);border:1px solid #ffffff1b;backdrop-filter:blur(22px);border-radius:17px;padding:12px 15px;box-shadow:0 15px 45px #0005}.playerrow{display:flex;align-items:center;gap:12px}.mini-cover{width:42px;height:46px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(145deg,#355f91,#132b4b);flex-shrink:0}.now{min-width:0;flex:1}.now strong{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now span{font-size:10px;color:var(--muted)}.playbtn{width:39px;height:39px;border:0;border-radius:50%;background:#3974b7;font-size:17px}.seekrow{display:flex;align-items:center;gap:9px;margin-top:8px;font-size:9px;color:var(--muted)}input[type=range]{accent-color:#8cb9f3;min-width:0;flex:1}
.mobilebrand,.mobile-nav{display:none}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:30;padding:11px 18px;border-radius:12px;background:#183457;border:1px solid var(--line);font-size:12px;opacity:0;transition:.2s;pointer-events:none}
.detailgrid{display:grid;grid-template-columns:180px 1fr;gap:25px}.detailgrid .bookcover{max-width:180px}.detailtext{font-size:14px;line-height:1.9}.empty{text-align:center;padding:35px;color:var(--muted);font-size:13px}
@media(max-width:850px){.bookgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.app{display:block}.sidebar{display:none}main{padding:18px 16px 185px}.mobilebrand{display:flex;align-items:center;gap:9px;font-size:13px;letter-spacing:2px;font-weight:700}.crumb{display:none}.bookgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}.hero{padding:22px}.detailgrid{grid-template-columns:115px 1fr;gap:17px}.detailgrid .bookcover{max-width:115px}.player{left:10px;right:10px;bottom:68px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:15;justify-content:space-around;padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:#09182bea;backdrop-filter:blur(20px);border-top:1px solid var(--line)}.mobile-nav button{background:none;border:0;color:#9aadc8;font-size:11px;min-width:58px}.mobile-nav button.active{color:#fff}.mobile-nav span{display:block;font-size:17px;margin-bottom:3px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brandmark">م</div><div><div class="brandname">MÜTALAA</div><div class="subbrand">İLİM KÜTÜPHANESİ</div></div></div>
 <div><p class="navtitle">KÜTÜPHANE</p><button class="navbtn active" data-page="home">⌂　 Ana Sayfa</button><button class="navbtn" data-page="library">▤　 Kitaplık</button><button class="navbtn" data-page="risale">✧　 Risale-i Nur</button><button class="navbtn" data-page="audio">♫　 Sesli Dersler</button></div>
 <div><p class="navtitle">KİŞİSEL</p><button class="navbtn" data-page="favorites">♡　 Favorilerim</button><button class="navbtn" data-page="notes">✎　 Notlarım</button><button class="navbtn" data-page="profile">◉　 Profilim</button></div>
 <div class="glass goal"><div style="font-size:12px">Günün Mütalaası</div><p class="small muted">Her gün birkaç sayfa, her gün yeni bir istifade.</p><div class="small muted">BUGÜNÜN HEDEFİ</div><div class="progress" style="margin-top:8px"><div id="goalProgress" style="width:0%"></div></div><div class="small muted" id="goalText" style="margin-top:7px">0 / 20 dakika</div></div>
</aside>
<main>
 <header class="topbar"><div class="mobilebrand"><div class="brandmark" style="width:34px;height:34px">م</div>MÜTALAA</div><div class="crumb" id="crumb">MÜTALAA / ANA SAYFA</div><div class="topactions"><button class="secondary" id="searchToggle">⌕ Ara</button><button class="secondary" data-page="profile">◉</button></div></header>
 <div id="searchBox" hidden style="margin-bottom:18px"><input class="searchinput" id="searchInput" type="search" placeholder="Kitap, yazar veya konu ara..."></div>
 <div id="content"></div>
</main>
</div>
<nav class="mobile-nav"><button class="active" data-page="home"><span>⌂</span>Ana Sayfa</button><button data-page="library"><span>▤</span>Kitaplık</button><button data-page="risale"><span>✧</span>Risale</button><button data-page="favorites"><span>♡</span>Favoriler</button></nav>
<div class="player"><div class="playerrow"><div class="mini-cover" id="miniCover">م</div><div class="now"><strong id="nowTitle">Henüz bir eser seçilmedi</strong><span id="nowAuthor">Dinlemek için bir eser seçin</span></div><button class="secondary" id="back15">↶15</button><button class="playbtn" id="play">▶</button><button class="secondary" id="forward15">15↷</button><button class="secondary" id="speed">1x</button></div><div class="seekrow"><span id="elapsed">00:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="duration">--:--</span></div><div class="small muted" id="voiceStatus" style="margin-top:5px">Türkçe sesli okuma cihazınızın ses motorunu kullanır.</div></div>
<div class="toast" id="toast"></div>
<script>
const books=[
{id:1,title:'Birinci Söz',author:'Bediüzzaman Said Nursî',cat:'Risale-i Nur',desc:'Bismillahın hakikatini ve kulluk şuurunu anlatan Risale-i Nur külliyatının başlangıç eseri.',color:'#315d8d',symbol:'ب',time:8,text:'Bismillah her hayrın başıdır. Biz dahi başta ona başlarız. Bil ey nefsim! Şu mübarek kelime İslam nişanı olduğu gibi bütün mevcudatın lisan-ı haliyle vird-i zebanıdır. Bismillah ne büyük tükenmez bir kuvvet, ne çok bitmez bir bereket olduğunu anlamak istersen şu temsilî hikâyeciğe bak ve dinle.'},
{id:2,title:'İkinci Söz',author:'Bediüzzaman Said Nursî',cat:'Risale-i Nur',desc:'İman ve ümit penceresinden hayata bakış.',color:'#27496f',symbol:'٢',time:9,text:'İman ne kadar kıymettar bir nimet ve ne kadar tükenmez bir hazine olduğunu anlamak istersen şu temsilî hikâyeciğe bak, dinle. Bir vakit iki adam, bir seyahate giderler. Biri hodbin, talihsiz; diğeri hüsnüzanlı, bahtiyar.'},
{id:3,title:'Sözler',author:'Bediüzzaman Said Nursî',cat:'Risale-i Nur',desc:'İman hakikatleri üzerine kapsamlı bir külliyat.',color:'#405a7c',symbol:'✧',time:35,text:'İman, insanı insan eder. Belki insanı sultan eder. Öyle ise insanın vazife-i asliyesi iman ve duadır. Küfür, insanı gayet âciz bir canavar hayvana çevirir.'},
{id:4,title:'İhya-u Ulumiddin',author:'İmam Gazali',cat:'Tasavvuf ve İrfan',desc:'İlim, ibadet, ahlak ve kalp hayatı üzerine klasik eser.',color:'#536b65',symbol:'ع',time:30,text:'İlim, kalbin hayatı ve ruhun nurudur. İnsan bildiğiyle amel ettiği zaman ilim onun için bir rehber olur. Bilginin gayesi yalnızca bilmek değil, hakikati yaşamak ve güzel ahlaka ulaşmaktır.'},
{id:5,title:'Çile',author:'Necip Fazıl Kısakürek',cat:'Fikir ve Edebiyat',desc:'Şiir, düşünce ve metafizik arayışın buluştuğu eser.',color:'#67536e',symbol:'ن',time:18,text:'Anladım işi, sanat Allahı aramakmış; marifet bu, gerisi yalnız çelik çomakmış. İnsan, arayışın içinde kendini bulur ve hakikatin izinde yürür.'},
{id:6,title:'İslam Deklarasyonu',author:'Aliya İzzetbegoviç',cat:'İslam Düşüncesi',desc:'İslam, toplum ve medeniyet üzerine düşünceler.',color:'#6b6049',symbol:'ا',time:22,text:'İslam, yalnızca bir din değil, aynı zamanda bir hayat anlayışıdır. İnanç ve hayat birbirinden ayrı düşünülemez. İnsan, düşüncesiyle ve eylemiyle inandığı değerleri yaşatmalıdır.'},
{id:7,title:'İslam ve İnsan',author:'Nurettin Topçu',cat:'Fikir ve Edebiyat',desc:'İnsan, ahlak ve sorumluluk üzerine denemeler.',color:'#426078',symbol:'م',time:15,text:'İnsan, yalnız kendi menfaatleri için yaşayan bir varlık değildir. Onu insan yapan şey, sorumluluk duygusu, merhameti ve hakikat arayışıdır.'},
{id:8,title:'Diriliş Neslinin Amentüsü',author:'Sezai Karakoç',cat:'Fikir ve Edebiyat',desc:'Diriliş düşüncesi ve medeniyet tasavvuru.',color:'#4a5778',symbol:'د',time:12,text:'Diriliş, insanın kendi özüne dönüşüdür. Bir medeniyetin yeniden doğuşu, önce insanın ruhunda başlar. Gelecek, inanç ve sorumlulukla inşa edilir.'}
];
let page='home',current=null,playing=false,elapsed=0,duration=0,speed=1,interval=null;
let favorites=JSON.parse(localStorage.getItem('mutalaa-favs')||'[]'),notes=JSON.parse(localStorage.getItem('mutalaa-notes')||'[]'),totalMinutes=Number(localStorage.getItem('mutalaa-minutes')||0);
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cover(b){return `<div class="bookcover" style="background:linear-gradient(145deg,${b.color},#101e35)"><div><div class="symbol">${b.symbol}</div><div class="brandmini">MÜTALAA</div><div class="covername">${esc(b.title)}</div><div class="coverauthor">${esc(b.author)}</div></div></div>`}
function card(b){return `<article class="book"><button data-open="${b.id}" style="display:block;width:100%;text-align:left;background:none;border:0;padding:0">${cover(b)}<div class="booktitle">${esc(b.title)}</div><div class="bookauthor">${esc(b.author)}</div><div class="bookmeta">${b.time} dk · ${esc(b.cat)}</div></button><div class="bookactions"><button class="secondary" data-play="${b.id}">▶ Dinle</button><button class="secondary" data-fav="${b.id}">${favorites.includes(b.id)?'♥':'♡'}</button></div></article>`}
function grid(arr){return `<div class="bookgrid">${arr.map(card).join('')}</div>`}
function heading(t,s){return `<div class="sectionhead"><h2>${t}</h2><p>${s}</p></div>`}
function home(){return `<section class="hero glass"><div class="eyebrow">BİLGİYE, HAKİKATE, İRFANA</div><h1>Dinle. Oku.<br><span>Mütalaa et.</span></h1><p>Düşünce, ilim ve edebiyat eserlerini keşfet. Kendi dijital kütüphaneni oluştur.</p><button class="primary" data-page="library">Kütüphaneyi keşfet →</button></section><div class="sectionhead"><h2>Kaldığın yerden devam et</h2><p>Dinlemeye hazır eserler</p></div>${grid(books.slice(0,4))}<div class="sectionhead"><h2>Öne çıkan eserler</h2><p>Kütüphaneden seçtiklerimiz</p></div>${grid(books.slice(4))}<div class="glass" style="padding:20px;margin-top:30px"><div class="small muted">GÜNLÜK İSTİFADE</div><b>Bugün ${totalMinutes} dakika dinledin.</b><p class="small muted">Her gün küçük bir adım.</p></div>`}
function library(){return `${heading('Kitaplık','Eserleri keşfet ve kendi dinleme yolculuğunu başlat.')}<div class="filters">${['Tümü','Risale-i Nur','İslam Düşüncesi','Fikir ve Edebiyat','Tasavvuf ve İrfan'].map((x,i)=>`<button class="secondary filter ${i===0?'selected':''}" data-filter="${x}">${x}</button>`).join('')}</div><div id="catalog">${grid(books)}</div>`}
function risale(){let a=books.filter(b=>b.cat==='Risale-i Nur');return `<div class="glass" style="padding:25px;margin-bottom:25px"><div class="eyebrow">ÖZEL KOLEKSİYON</div><h1 style="font-size:28px;margin:13px 0">Risale-i Nur Külliyatı</h1><p class="muted" style="font-size:13px;line-height:1.7">İman hakikatleri, tefekkür ve marifet üzerine eserler. Külliyatı kitap ve bahis sırasına göre keşfet.</p><div class="small muted">${a.length} örnek eser · Sesli okuma</div></div>${heading('Külliyattan seçmeler','Eserler ve örnek dinleme içerikleri')}${grid(a)}`}
function favoritesPage(){let a=books.filter(b=>favorites.includes(b.id));return heading('Favorilerim','Kaydettiğin eserlere buradan ulaş.')+(a.length?grid(a):'<div class="glass empty">Henüz favori eserin yok. Kitaplardan ♡ simgesine dokun.</div>')}
function notesPage(){return heading('Notlarım','Dinleme sırasında kaydettiğin notlar.')+(notes.length?notes.map((n,i)=>`<div class="glass" style="padding:16px;margin-bottom:12px"><div class="small muted">${esc(n.title)} · ${esc(n.date)}</div><p style="font-size:13px;line-height:1.7">${esc(n.text)}</p><button class="secondary" data-delete-note="${i}">Notu sil</button></div>`).join(''):'<div class="glass empty">Henüz not eklemedin.</div>')}
function profile(){return `${heading('Profilim','Kişisel dinleme alanın')}<div class="glass" style="padding:20px;margin-bottom:13px"><div class="small muted">TOPLAM DİNLEME</div><div style="font-size:32px;font-weight:650;margin:8px 0">${totalMinutes} <span class="small muted">dakika</span></div><div class="progress"><div style="width:${Math.min(100,totalMinutes/20*100)}%"></div></div><p class="small muted">Günlük 20 dakika hedefi</p></div><div class="glass" style="padding:20px"><b style="font-size:13px">Kütüphane bilgileri</b><p class="small muted">Favoriler: ${favorites.length} eser</p><p class="small muted">Kişisel notlar: ${notes.length}</p><p class="small muted">Veriler bu tarayıcıda saklanır.</p></div><button class="secondary" style="margin-top:14px" id="reset">Dinleme istatistiklerini sıfırla</button>`}
function audio(){return heading('Sesli Dersler','Dinlemeye hazır eserler ve örnek okumalar.')+grid(books.slice(0,6))}
function render(p){page=p;let names={home:'ANA SAYFA',library:'KİTAPLIK',risale:'RİSALE-İ NUR',audio:'SESLİ DERSLER',favorites:'FAVORİLERİM',notes:'NOTLARIM',profile:'PROFİLİM'};$('crumb').textContent='MÜTALAA / '+names[p];$('content').innerHTML=({home,library,risale,audio,favorites:favoritesPage,notes:notesPage,profile})[p]();document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p))}
function detail(b){$('content').innerHTML=`<button class="secondary" id="goBack" style="margin-bottom:20px">← Geri dön</button><div class="detailgrid page"><div>${cover(b)}</div><div><div class="small muted">${esc(b.cat)}</div><h1 style="font-size:26px;margin:9px 0">${esc(b.title)}</h1><p class="muted" style="font-size:13px">${esc(b.author)}</p><p class="detailtext">${esc(b.desc)}</p><div class="small muted">${b.time} dakika · Örnek metin</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px"><button class="primary" id="detailPlay">▶ Dinlemeye başla</button><button class="secondary" id="detailFav">${favorites.includes(b.id)?'♥':'♡'} Favorilere ekle</button></div></div></div><div class="glass" style="padding:20px;margin-top:28px"><div class="eyebrow">ESERDEN BİR BÖLÜM</div><p class="detailtext">${esc(b.text)}</p><button class="secondary" id="saveQuote">✎ Bu metinden not oluştur</button></div>`;$('goBack').onclick=()=>render('library');$('detailPlay').onclick=()=>start(b);$('detailFav').onclick=()=>toggleFav(b.id);$('saveQuote').onclick=()=>{notes.unshift({title:b.title,text:b.text,date:new Date().toLocaleDateString('tr-TR')});save();toast('Metin notlarına eklendi.')}}
function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;setTimeout(()=>$('toast').style.opacity=0,1800)}
function save(){localStorage.setItem('mutalaa-favs',JSON.stringify(favorites));localStorage.setItem('mutalaa-notes',JSON.stringify(notes));localStorage.setItem('mutalaa-minutes',totalMinutes)}
function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();render(page);toast('Favori listen güncellendi.')}
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0')}
function update(){ $('elapsed').textContent=fmt(elapsed);$('seek').value=duration?elapsed/duration*100:0;$('play').textContent=playing?'Ⅱ':'▶';$('goalProgress').style.width=Math.min(100,totalMinutes/20*100)+'%';$('goalText').textContent=totalMinutes+' / 20 dakika'}
function start(b){current=b;elapsed=0;duration=b.time*60;$('nowTitle').textContent=b.title;$('nowAuthor').textContent=b.author;$('miniCover').textContent=b.symbol;$('duration').textContent=fmt(duration);playSpeech()}
function playSpeech(){if(!current){toast('Önce bir eser seçmelisin.');return}if(!('speechSynthesis'in window)){toast('Tarayıcı sesli okumayı desteklemiyor.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(current.text);u.lang='tr-TR';u.rate=speed;let v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('tr'));if(v)u.voice=v;u.onstart=()=>{$('voiceStatus').textContent='Türkçe sesli okuma aktif'};u.onend=()=>{playing=false;update()};u.onerror=()=>{$('voiceStatus').textContent='Ses motoru okuma sırasında durdu.'};playing=true;update();speechSynthesis.speak(u)}
function pause(){speechSynthesis.cancel();playing=false;update()}
document.addEventListener('click',e=>{
let p=e.target.closest('[data-page]');if(p){render(p.dataset.page);return}
let o=e.target.closest('[data-open]');if(o){detail(books.find(b=>b.id==o.dataset.open));return}
let pl=e.target.closest('[data-play]');if(pl){start(books.find(b=>b.id==pl.dataset.play));return}
let f=e.target.closest('[data-fav]');if(f){toggleFav(+f.dataset.fav);return}
let fl=e.target.closest('[data-filter]');if(fl){document.querySelectorAll('.filter').forEach(x=>x.classList.remove('selected'));fl.classList.add('selected');let arr=fl.dataset.filter==='Tümü'?books:books.filter(b=>b.cat===fl.dataset.filter);$('catalog').innerHTML=grid(arr);return}
let d=e.target.closest('[data-delete-note]');if(d){notes.splice(+d.dataset.deleteNote,1);save();render('notes')}
});
$('play').onclick=()=>{if(!current){toast('Dinlemek için bir eser seç.');return}playing?pause():playSpeech()};
$('speed').onclick=()=>{speed=speed===1?1.25:speed===1.25?1.5:speed===1.5?1.75:speed===1.75?2:1;$('speed').textContent=speed+'x';if(playing)playSpeech()};
$('back15').onclick=()=>{if(current){elapsed=Math.max(0,elapsed-15);playSpeech()}};
$('forward15').onclick=()=>{if(current){elapsed=Math.min(duration,elapsed+15);playSpeech()}};
$('seek').oninput=()=>{elapsed=Math.round(duration*$('seek').value/100);$('elapsed').textContent=fmt(elapsed)};
$('seek').onchange=()=>{if(playing)playSpeech()};
$('searchToggle').onclick=()=>{$('searchBox').hidden=!$('searchBox').hidden;if(!$('searchBox').hidden)$('searchInput').focus()};
$('searchInput').oninput=()=>{let q=$('searchInput').value.toLocaleLowerCase('tr');let arr=books.filter(b=>(b.title+' '+b.author+' '+b.cat).toLocaleLowerCase('tr').includes(q));$('content').innerHTML=heading('Arama sonuçları','Aradığın eserler')+(arr.length?grid(arr):'<div class="glass empty">Sonuç bulunamadı.</div>')};
$('content').addEventListener('click',e=>{if(e.target.id==='reset'&&confirm('Dinleme istatistiklerini sıfırlamak istiyor musun?')){totalMinutes=0;save();render('profile')}});
setInterval(()=>{if(playing&&current){elapsed++;if(elapsed%60===0){totalMinutes++;save()}if(elapsed>=duration)pause();update()}},1000);
render('home');update();
</script>
</body>
</html>
